name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        # The dependency floor (pyproject: pylatexenc>=2.10) and the locked one.
        pylatexenc: ["locked", "2.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (locked pylatexenc)
        if: matrix.pylatexenc == 'locked'
        run: uv run --locked pytest -q
      - name: Tests (pylatexenc ${{ matrix.pylatexenc }})
        if: matrix.pylatexenc != 'locked'
        run: uv run --locked --with "pylatexenc==${{ matrix.pylatexenc }}" pytest -q
