[project]
name = "mathunicode"
version = "0.2.0"
description = "LaTeX -> readable Unicode approximation for terminals/editors, with fixes for macros pylatexenc silently drops or mishandles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  # Uses 2.x internals (MacroTextSpec callables, parsed macro arguments);
  # pylatexenc 3 is a rewrite. Tested on 2.10 and 2.11.
  "pylatexenc>=2.10,<3",
]

[project.scripts]
mathunicode = "mathunicode.cli:main"
mathunicode-collapse-blocks = "mathunicode.cli:main_collapse_blocks"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Fail on any warning, including SyntaxWarning for an invalid escape in a
# test string (easy to write in LaTeX test cases, and silently wrong).
filterwarnings = ["error"]
