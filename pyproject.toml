[project]
name = "mathunicode"
version = "0.4.0"
description = "LaTeX math -> one line of readable Unicode (via latex2mathml), plus finding math in Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "latex2mathml>=3.81,<4",
]

[project.scripts]
mathunicode = "mathunicode.cli:main"
mathunicode-collapse-blocks = "mathunicode.cli:main_collapse_blocks"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Fail on any warning, including SyntaxWarning for an invalid escape in a
# test string (easy to write in LaTeX test cases, and silently wrong).
filterwarnings = ["error"]
