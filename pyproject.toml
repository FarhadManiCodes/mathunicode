[project]
name = "mathunicode"
version = "0.1.0"
description = "LaTeX -> readable Unicode approximation for terminals/editors, with fixes for macros pylatexenc silently drops or mishandles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "pylatexenc>=2.10",
]

[project.scripts]
mathunicode = "mathunicode.cli:main"
mathunicode-collapse-blocks = "mathunicode.cli:main_collapse_blocks"

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
